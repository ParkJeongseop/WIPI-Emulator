# xcodegen 프로젝트 정의 — `xcodegen generate`로 WipiEmulator.xcodeproj 생성
# Rust 라이브러리는 build_rust.sh(preBuildScript)가 빌드 대상에 맞춰 자동으로 cargo 빌드하므로
# 별도 수동 cargo 단계가 필요 없다 (Xcode ⌘R 한 번이면 됨).
name: WipiEmulator
options:
  bundleIdPrefix: com.parkjeongseop
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
targets:
  WipiEmulator:
    type: application
    platform: iOS
    sources:
      - path: WipiEmulator
    preBuildScripts:
      - path: build_rust.sh
        name: "Build Rust (wipi_ios)"
        basedOnDependencyAnalysis: false   # 매 빌드마다 실행 (cargo가 자체적으로 증분 판단)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parkjeongseop.wipi
        SWIFT_OBJC_BRIDGING_HEADER: WipiEmulator/BridgingHeader.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../rust/wipi_ios/include
        OTHER_LDFLAGS: -lwipi_ios -framework AudioToolbox -framework CoreAudio -framework CoreHaptics
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../rust/target/aarch64-apple-ios-sim/release-ios
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../rust/target/aarch64-apple-ios/release-ios
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.3.1"       # Android versionName과 통일
        CURRENT_PROJECT_VERSION: "6"     # Android versionCode와 통일
        # 실기기: 자동 서명 (Personal Team). 시뮬레이터는 서명 불필요.
        DEVELOPMENT_TEAM: 7WYMPDQCGP
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
    info:
      path: WipiEmulator/Info.plist
      properties:
        CFBundleDisplayName: WIPI Emulator
        CFBundleShortVersionString: "0.3.1"   # Android versionName과 통일
        CFBundleVersion: "5"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # 파일 앱/iTunes에서 게임 파일을 넣을 수 있게 (게임은 사용자 임포트만 — 앱스토어 4.7 대응)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
