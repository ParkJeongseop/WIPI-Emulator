[package]
name = "wipi_android"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
# cdylib만: rlib("lib")을 같이 내면 cargo가 이 크레이트의 LTO를 조용히 끈다 (프로필의 lto = true가 무시됨).
# headless 바이너리는 wipi_core를 직접 쓴다.
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wie_backend = { workspace = true }
wipi_core = { path = "../wipi_core" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
paranoid-android = "0.2"
