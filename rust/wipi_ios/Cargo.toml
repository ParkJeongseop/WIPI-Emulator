[package]
name = "wipi_ios"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
# staticlib만: rlib("lib")을 같이 내면 cargo가 이 크레이트의 LTO를 조용히 끈다 (프로필의 lto = true가 무시됨).
crate-type = ["staticlib"]

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wipi_core = { path = "../wipi_core" }
