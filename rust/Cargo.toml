[workspace]
resolver = "2"
members = ["wipi_android", "wipi_core", "wipi_ios"]

[workspace.dependencies]
# wie 코어는 본인 포크(ParkJeongseop/wie) + rev 고정으로 소비 — 미머지 개선을 앱에 먼저 적용하기 위함.
# 원칙: 포크의 main은 upstream(dlunch/wie) 추적, 기능은 브랜치로 작업해 upstream PR + 앱용 rev 갱신.
# upstream 머지 후엔 해당 rev로 복귀. 코어 디버깅 시엔 임시로 path = "../../wie/..." 전환.
# 현재 rev: d08a08a9 (sync/upstream-2026-09-21 — upstream v0.1.4 병합 + LGT strncat·util·stdlib·LWC·MC_im + SK-VM 키코드 + LBMP 마스크/그레이 + LGT 텍스트 원점: 플랫폼 제공 폰트(Platform::font),
# RustJava 0.2.0(+포크 patch c320364: modified UTF-8 클래스 상수, System.exec, Runtime 메모리 16MB, InputStreamReader 요청 길이 채움), KTF native ABI·LGT 수정, LGT ez-java(MMPP, JAD+JAR 아카이브), MIDP repaint·showNotify 수정,
# SK-VM 입력기(TextComponentHandler)·TextField·Image() 등 SKT 90종이 링크하는 클래스 전부, KTF catch 블록 예외 객체 전달·레코드 DB(테이블 5)·MC_fsMkDir·HandsetProperty 값.
# 우리 델타: BMP 색상키 투명, 폰트 메트릭·베이스라인 DrawString(draw_text size 인자 유지), KTF 이름 tag 해시, MIDlet 시스템로더 로드)
wie_backend = { package = "wie-backend", git = "https://github.com/ParkJeongseop/wie.git", rev = "d1a05c5f" }
wie_ktf = { package = "wie-ktf", git = "https://github.com/ParkJeongseop/wie.git", rev = "d1a05c5f" }
wie_lgt = { package = "wie-lgt", git = "https://github.com/ParkJeongseop/wie.git", rev = "d1a05c5f" }
wie_skt = { package = "wie-skt", git = "https://github.com/ParkJeongseop/wie.git", rev = "d1a05c5f" }
wie_j2me = { package = "wie-j2me", git = "https://github.com/ParkJeongseop/wie.git", rev = "d1a05c5f" }
wie_util = { package = "wie-util", git = "https://github.com/ParkJeongseop/wie.git", rev = "d1a05c5f" }
wie_core_arm_portable = { package = "wie-core-arm-portable", git = "https://github.com/ParkJeongseop/wie.git", rev = "d1a05c5f" }

[profile.release]
lto = true
opt-level = 3

# iOS staticlib도 fat LTO: rustc가 LTO를 끝낸 기계어 오브젝트만 아카이브에 담으므로 Xcode ld의 LLVM 버전과 무관하다.
# 인터프리터 루프(arm32_cpu ↔ wie-core-arm)가 크레이트 경계를 넘어 인라인되지 않으면 타이틀 CPU 비용이 약 1.5배가 된다.
[profile.release-ios]
inherits = "release"

# RustJava는 wie와 동일하게 crates.io + 포크 패치(rev 고정)로 소비 — wie의 [patch]와 반드시 일치시킬 것.
[patch.crates-io]
jvm = { git = "https://github.com/ParkJeongseop/RustJava.git", rev = "c9a2d1b" }
jvm-bytecode = { git = "https://github.com/ParkJeongseop/RustJava.git", rev = "c9a2d1b" }
jvm-class-proto = { git = "https://github.com/ParkJeongseop/RustJava.git", rev = "c9a2d1b" }
jvm-types = { git = "https://github.com/ParkJeongseop/RustJava.git", rev = "c9a2d1b" }
rustjava-runtime = { git = "https://github.com/ParkJeongseop/RustJava.git", rev = "c9a2d1b" }
